# Usage (see README.md):
#   docker compose build
#   docker compose run --rm experiments           # quick, about 10 min, no license needed
#   export GRAPHDB_LICENSE=/path/to/graphdb.license
#   docker compose run --rm experiments full      # everything, 9-13 h (or: check, listings, tables, report)
#   docker compose down
# A fixed project name, whatever the folder is called (run_ubuntu.sh finds the run's container by it).
name: krrood-aamas27
services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_USER: krrood_experiments
      POSTGRES_PASSWORD: krrood_experiments
      POSTGRES_DB: krrood_experiments
    shm_size: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "krrood_experiments", "-d", "krrood_experiments"]
      interval: 2s
      retries: 60

  experiments:
    build: .
    image: krrood-aamas27
    hostname: aamas27
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KRROOD_EXPERIMENTS_DATABASE_URI: postgresql+psycopg2://krrood_experiments:krrood_experiments@postgres:5432/krrood_experiments
      KRROOD_GRAPHDB_URL: http://localhost:7200
      GRAPHDB_HEAP: ${GRAPHDB_HEAP:-8g}
      QUERY_REPETITIONS: ${QUERY_REPETITIONS:-10}
      LOADING_REPETITIONS: ${LOADING_REPETITIONS:-5}
      RDFLIB_TIMEOUT_SECONDS: ${RDFLIB_TIMEOUT_SECONDS:-10800}
      ABLATION_TIMEOUT_SECONDS: ${ABLATION_TIMEOUT_SECONDS:-7200}
    volumes:
      - ./state:/state
      # The paper's results: the report compares with them, and quick mode uses GraphDB's answer sets.
      - ./results:/paper_results:ro
      # GraphDB needs a license file (README.md); without one, reproduce.sh skips the steps that need GraphDB.
      # A path that does not exist is an error here, instead of Docker creating an empty folder there.
      - type: bind
        source: ${GRAPHDB_LICENSE:-/dev/null}
        target: /license/graphdb.license
        read_only: true
        bind:
          create_host_path: false
