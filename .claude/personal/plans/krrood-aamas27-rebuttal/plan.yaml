schema_version: 1
id: krrood-aamas27-rebuttal
title: 'KRROOD AAMAS 2027: one version, new evidence, rebuttal'
description: 'Answer the AAMAS 2027 reviews of submission 1481 (KRROOD) by 24 November. Bring the revision
  branch''s EQL and ORMatic work onto cram2 main, build on Sorin Arion''s Ontomatic port there, rerun
  every experiment on one pinned main commit, add LUBM, a retraction variant of the agent loop and a reflection
  listing, update the proofs, and write the rebuttal and the revised paper.

  '
default_repository: AbdelrhmanBassiouny/krrood_experiments
tracking_issue: 2
waves:
- id: one-version
  name: One version (20-22 Nov)
  description: Everything the paper claims runs on one pinned cram2 main commit.
- id: evidence
  name: Reruns and new evidence (22-23 Nov)
- id: response
  name: Rebuttal and revision (by 24 Nov)
tracks:
- id: port
  name: Port to cram2 main
  wave: one-version
- id: theory
  name: Proofs
  wave: one-version
- id: evaluation
  name: Experiments
  wave: evidence
- id: writing
  name: Rebuttal and paper
  wave: response
items:
- id: experiments-on-current-version
  title: Run the experiments and the agent loop on the current version only
  track: port
  depends_on:
  - ontomatic-paper-check
  status: not started
  recommended_model: sonnet
  notes: 'Pin one cram2 main commit for every run and record it. Branch from unification-revision in krrood_experiments.
    Move code/earlier/experiments (OWL2Bench model generation, the 18 queries per system, scripts/aamas27,
    the agent loop and baselines) onto code/current; the bundle then has one KRROOD environment. Baselines
    that do not use KRROOD stay as they are. Sorin''s owl2bench-experiments puts the same models and queries
    into CRAM''s experiments/: agree with him which copy the paper cites.

    '
- id: proofs-on-current-version
  title: Point the proofs at the current version and sketch them in the paper
  track: theory
  depends_on: []
  status: not started
  recommended_model: opus
  notes: 'supplement/formalization: Section 5 lemmas cite earlier-only files, Theorem 6.1 cites the revision
    branch. Point every reference at the pinned main commit once the port items land, rewrite Corollary
    5.4''s proof for identity equality, drop the two-version text, and write a 3-5 line sketch per result
    for the paper.

    '
- id: owl2bench-rerun
  title: Rerun every OWL2Bench result on the current version
  track: evaluation
  depends_on:
  - experiments-on-current-version
  status: not started
  recommended_model: sonnet
  notes: 'Correctness (closure vs GraphDB and Nemo, 18 answer sets), Tables 2-5 including 2-8 universities,
    the ORMatic 18-query check and the agent loop with the runtime comparison. Only KRROOD''s rows need
    rerunning. Record provenance.txt per result; report any number that moves by more than run-to-run
    variance.

    '
- id: lubm-evaluation
  title: 'Evaluate on LUBM: closure, loading and its 14 queries'
  track: evaluation
  depends_on:
  - experiments-on-current-version
  status: not started
  recommended_model: sonnet
  notes: 'Start from src/krrood_experiments/lubm and test/test_lubm. LUBM''s class equivalences with existential
    right-hand sides (e.g. Chair) are outside OWL 2 RL: compare against GraphDB''s OWL 2 RL closure and
    state the covered fragment. The other systems'' runs do not need the port and can start now. LUBM
    has no symmetric, transitive property, which answers the step-5 point.

    '
- id: retraction-agent-loop
  title: Agent loop variant whose perceived facts change and disappear
  track: evaluation
  depends_on:
  - experiments-on-current-version
  status: not started
  recommended_model: opus
  notes: 'Students drop courses and leave colleges, fans stop being fans. Measure separately: computed
    predicates (recomputed per query), reassigned attributes (replaced) and facts derived by property
    rules (not retracted). Compare decisions with Nemo, which recomputes the closure, and report every
    stale rule-derived fact honestly.

    '
- id: reflection-listing
  title: 'Listing: an EQL query over the agent''s own queries and rules'
  track: evaluation
  depends_on: []
  status: not started
  recommended_model: sonnet
  notes: 'Branch from cram2 main. Executable listing test, e.g. which rules derive T20CricketFan, which
    decisions call CanReach, why a fact was inferred (provenance). Goes in supplement/listings and is
    the paper''s evidence for reflection (Newell''s knowledge level); contrast with storing SPARQL queries
    as RDF.

    '
  repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
- id: rebuttal-response
  title: Write the author response to the four reviews
  track: writing
  depends_on: []
  status: not started
  recommended_model: opus
  notes: 'Due 24 Nov; draft now, fill numbers from the reruns. Lead with one version. Points: motivation
    (sync code, reflection), closed world as certain answers of positive queries (no open-world claim),
    step 5 exact and general, LUBM, retraction in three kinds, joins vs the SQL path, citations. Do not
    add the Legal BERT reference.

    '
  repository: AbdelrhmanBassiouny/krrood_aamas
- id: paper-revision
  title: Revise the paper for the response and the camera-ready
  track: writing
  depends_on:
  - proofs-on-current-version
  - owl2bench-rerun
  status: not started
  recommended_model: opus
  notes: 'Remove footnotes 2-3 and the earlier-equality clause, add proof sketches, cite GraphDB, Nemo
    and Owlready2 in the introduction, full sentences in Section 3, fix the 1.42 million sentence, narrower
    title, a novelty paragraph tied to Table 1, reflection and retraction paragraphs, LUBM results, cite
    the rela-model paper. Paper source: krrood_aamas_2027/main.tex.'
  repository: AbdelrhmanBassiouny/krrood_aamas

- id: revision-commits-to-main
  title: The revision branch's EQL and ORMatic commits on cram2 main
  track: port
  depends_on: []
  status: not started
  recommended_model: opus
  notes: 'Tracked in the CRAM fork''s plan ontomatic-port, track paper-eql-ormatic: eql-predicate-call-memo
    (fork PR 553), ormatic-collection-translation, ormatic-identifier-selection, ormatic-reference-fixes.
    Not in any item yet: 3308cb252f, one inference object per class and argument binding. Correlated quantifiers
    already merged (cram2#915). Theorem 6.1 cites this code.

    '
  repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine

- id: ontomatic-on-main
  title: Sorin Arion's Ontomatic port on cram2 main
  track: port
  depends_on: []
  status: in progress
  recommended_model: opus
  notes: 'Sorin Arion''s plan ontomatic-port on sorinar329''s notes branch (tracking issue sorinar329#26);
    we write none of it unless he asks. The paper needs: descriptor-characteristics (cram2#892), descriptor-provenance
    (cram2#909), ontology-extraction (cram2#954), ontology-axioms, ontology-inference, ontology-code-generation
    (fork PRs 35-37), owl2rl-consistency-check (30), abox-loader (31). Send him Definition assign, Lemma
    Step 4 and Corollary 5.4 (store a value on an object whose class fits the range).

    '
  repository: sorinar329/cognitive_robot_abstract_machine

- id: ontomatic-paper-check
  title: Check main's Ontomatic against the supplement and the earlier OWL2Bench closure
  track: port
  depends_on:
  - ontomatic-on-main
  - revision-commits-to-main
  status: not started
  recommended_model: sonnet
  notes: 'Done when the OWL2Bench closure from main''s loader equals the earlier run''s closure, assertion
    by assertion, and its rules match the lemmas. Sorin''s closure-verification (against owlrl) does not
    cover this. Report each gap to him rather than patching his port.

    '
  repository: AbdelrhmanBassiouny/cognitive_robot_abstract_machine
