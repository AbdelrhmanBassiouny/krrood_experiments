# Written by basstler's /setup-personal-notes; re-run it to update this file rather than
# editing it here.
name: Plan site dispatch

# Every push to the notes branch starts the plan site's build in AbdelrhmanBassiouny/stack-board.
on:
  push:
    branches: [claude/personal-notes]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: plan-site-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    name: Start the plan site build
    if: github.repository == 'AbdelrhmanBassiouny/krrood_experiments'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the build
        env:
          GH_TOKEN: ${{ secrets.PLAN_SITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=PLAN_SITE_TOKEN is not stored::AbdelrhmanBassiouny/krrood_experiments stores no PLAN_SITE_TOKEN secret, so this run started no build in AbdelrhmanBassiouny/stack-board. Run /setup-personal-notes, or create the token at https://github.com/settings/personal-access-tokens/new?name=basstler+plan+site&description=Starts+the+plan+site+build+in+AbdelrhmanBassiouny%2Fstack-board&target_name=AbdelrhmanBassiouny&actions=write and store it at https://github.com/AbdelrhmanBassiouny/krrood_experiments/settings/secrets/actions/new"
            exit 1
          fi
          gh workflow run plan-site.yml --repo AbdelrhmanBassiouny/stack-board
